<svg xmlns="http://www.w3.org/2000/svg" width="380" height="598" viewBox="0 0 380 598">
  <title>MealBot WhatsApp demo — onboarding</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="380" height="598" fill="#E5DDD5"/>
  
    <rect x="0" y="0" width="380" height="64" fill="#075E54"/>
    <circle cx="36" cy="32.0" r="16" fill="#FFFFFF" opacity="0.9"/>
    <text x="36" y="37.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#075E54">M</text>
    <text x="62" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold">MealBot</text>
    <text x="62" y="46.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#D9FDD3">online</text>
    
  <rect x="309.5" y="78" width="60.5" height="50" rx="8" fill="#DCF8C6" filter="url(#shadow)"/>
<text x="321.5" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">start</text>
<text x="362.0" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#667781" text-anchor="end"><tspan fill="#4FC3F7">✓✓</tspan> 9:14 AM</text><rect x="10" y="138" width="221.1" height="68" rx="8" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="22" y="160" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">Welcome! What is your daily</text>
<text x="22" y="178" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">calorie goal?</text>
<text x="223.1" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#667781" text-anchor="end">9:15 AM</text><rect x="310" y="216" width="60" height="50" rx="8" fill="#DCF8C6" filter="url(#shadow)"/>
<text x="322" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">2000</text>
<text x="362" y="260" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#667781" text-anchor="end"><tspan fill="#4FC3F7">✓✓</tspan> 9:16 AM</text><rect x="10" y="276" width="206.5" height="68" rx="8" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="22" y="298" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">Great. What is your daily</text>
<text x="22" y="316" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">protein goal in grams?</text>
<text x="208.5" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#667781" text-anchor="end">9:17 AM</text><rect x="310" y="354" width="60" height="50" rx="8" fill="#DCF8C6" filter="url(#shadow)"/>
<text x="322" y="376" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">150</text>
<text x="362" y="398" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#667781" text-anchor="end"><tspan fill="#4FC3F7">✓✓</tspan> 9:18 AM</text><rect x="10" y="414" width="250" height="122" rx="8" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="22" y="436" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">You're set: 2,000 kcal and 150g</text>
<text x="22" y="454" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">protein daily.</text>
<text x="22" y="472" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">Send a meal photo whenever you</text>
<text x="22" y="490" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">eat. Type 'help' anytime to see</text>
<text x="22" y="508" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111B21">what else I can do.</text>
<text x="252" y="530" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#667781" text-anchor="end">9:19 AM</text>
  
    <rect x="0" y="546" width="380" height="52" fill="#F0F0F0"/>
    <rect x="10" y="556" width="320" height="32" rx="16" fill="#FFFFFF" stroke="#D8D8D8"/>
    <text x="24" y="576" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9AA0A6">Message</text>
    <circle cx="352" cy="572" r="17" fill="#075E54"/>
    <text x="352" y="577" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#FFFFFF">➤</text>
    
</svg>